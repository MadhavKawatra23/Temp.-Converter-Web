<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temperature Converter</title>


  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="temp.css" />
</head>
<body>

  <main class="card">

    <header class="card-header">
      <h1>Temperature Converter</h1>
     
      <span class="status" id="status" title="Status: OK" aria-label="Status indicator"></span>
    </header>

    <section class="gauge" aria-live="polite">
      <svg class="gauge-svg" viewBox="0 0 300 300" role="img" aria-label="Temperature gauge">
      
        <circle class="gauge-track" cx="150" cy="150" r="120" />
       
        <circle class="gauge-progress" id="progress" cx="150" cy="150" r="120" />
       
        <g class="gauge-dot-group" id="dotGroup">
          <circle class="gauge-dot-ring" cx="150" cy="30" r="13" />
          <circle class="gauge-dot" cx="150" cy="30" r="7" />
        </g>
      </svg>

      <div class="gauge-center">
        <div class="gauge-value" id="gaugeValue">25°</div>
        <div class="gauge-unit" id="gaugeUnit">Celsius</div>
      </div>
    </section>


    <section class="results" aria-label="Conversion results">
      <div class="result" id="card-celsius">
        <span class="result-label">Celsius</span>
        <span class="result-value" id="out-celsius">25 °C</span>
      </div>
      <div class="result" id="card-fahrenheit">
        <span class="result-label">Fahrenheit</span>
        <span class="result-value" id="out-fahrenheit">77 °F</span>
      </div>
      <div class="result" id="card-kelvin">
        <span class="result-label">Kelvin</span>
        <span class="result-value" id="out-kelvin">298.15 K</span>
      </div>
    </section>

    <p class="error" id="error" role="alert"></p>


    <form class="controls" id="form" novalidate>
      <input
        type="text"
        id="tempInput"
        class="field"
        placeholder="Enter temperature"
        inputmode="decimal"
        autocomplete="off"
        aria-label="Temperature value"
        value="25"
      />

      <div class="select-wrap">
        <select id="unitSelect" class="field" aria-label="Unit">
          <option value="celsius" selected>Celsius</option>
          <option value="fahrenheit">Fahrenheit</option>
          <option value="kelvin">Kelvin</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary">
        <!-- Refresh icon -->
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.64-6.36" />
          <polyline points="21 3 21 9 15 9" />
        </svg>
        Convert
      </button>

      <button type="button" class="btn btn-reset" id="resetBtn" title="Reset" aria-label="Reset">
    
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 2.64-6.36" />
          <polyline points="3 3 3 9 9 9" />
        </svg>
      </button>
    </form>

  </main>

  <script src="temp.js".js"></script>
</body>
</html>
